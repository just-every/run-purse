name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  rer-verify:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: bash scripts/ci/reclaim-disk.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - name: Build the Worker, assets and run site once
        run: pnpm exec rer build && pnpm exec rer build --site && node scripts/ci/shared-build.mjs record
      - name: Light verification
        run: pnpm typecheck && pnpm exec rer check --profile first-party && pnpm check:deployment-spec && pnpm sources:check
      - uses: actions/upload-artifact@v4
        with:
          name: purse-build
          path: dist
          include-hidden-files: true
          retention-days: 1
  browser:
    needs: [plan, rer-verify]
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1
          - group: 2
          - group: 3
          - group: 4
            pantry: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        run: bash scripts/ci/reclaim-disk.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - uses: actions/download-artifact@v4
        with:
          name: purse-build
          path: dist
      - name: Install Chromium
        if: matrix.group == 4
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - name: Install the real Pantry integration peer
        if: matrix.pantry == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .cache/native-pantry
          gh api repos/just-every/run-pantry/tarball/fb080a57b795dede06bfe6be2db7b85cc31a696b > "$RUNNER_TEMP/pantry.tar.gz"
          tar -xzf "$RUNNER_TEMP/pantry.tar.gz" --strip-components=1 -C .cache/native-pantry
          pnpm --dir .cache/native-pantry install --frozen-lockfile
      - name: Run the public journeys in the group
        run: node scripts/ci/run-shard.mjs ${{ matrix.group }}
        env:
          PANTRY_CHECKOUT: ${{ github.workspace }}/.cache/native-pantry
          PANTRY_SOURCE_SHA: fb080a57b795dede06bfe6be2db7b85cc31a696b
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-browser-proof-${{ matrix.group }}
          path: ${{ runner.temp }}/purse-proof
  verify:
    needs: [plan, rer-verify, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
