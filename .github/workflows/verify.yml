name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo 'Disk before SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          # Purse uses Node and Chromium, not the image's Android, .NET or Haskell SDKs.
          # Exact SDK roots come from actions/runner-images' Ubuntu installation scripts.
          # Keep Node/Corepack, checkout, system libraries and browser dependencies intact.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          echo 'Disk after SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec rer verify
  browser:
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 390]
        # Every shard runs the complete archive checks and invoice-reading journey
        # (tests/browser.mjs and tests/browser-shard.mjs), so neither needs its own job.
        journey: [supplier-performance, catalogue, order-chasing, supplier-documents, supplier-duplicates, payables, audit-log, spend-report, po-documents, performance-report, invoice-risk, receipt-routing, quote-reading, rfq, invoice-inbox, email-intake, search, agreements, integration-tokens, agent-value, quote-agent, order-adoption, protected-storage, protected-preparation]
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.width == 1440 && 25 || 15 }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo 'Disk before SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          # Purse uses Node and Chromium, not the image's Android, .NET or Haskell SDKs.
          # Exact SDK roots come from actions/runner-images' Ubuntu installation scripts.
          # Keep Node/Corepack, checkout, system libraries and browser dependencies intact.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          echo 'Disk after SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: node tests/browser.mjs --width=${{ matrix.width }} --journey=${{ matrix.journey }}
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-browser-and-archive-proof-${{ matrix.journey }}-${{ matrix.width }}
          path: ${{ runner.temp }}/purse-proof
  purchase-kinds:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo 'Disk before SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          # Purse uses Node and Chromium, not the image's Android, .NET or Haskell SDKs.
          # Exact SDK roots come from actions/runner-images' Ubuntu installation scripts.
          # Keep Node/Corepack, checkout, system libraries and browser dependencies intact.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          echo 'Disk after SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: node tests/browser-po-kinds.mjs
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-po-kinds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-po-kinds-and-archive-proof
          path: ${{ runner.temp }}/purse-po-kinds
  native-browser:
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 390]
        journey: [spend-questions, request-again, protected-web, access, identity, scim, erasure, intake, order-send, evidence-history, integration-tokens, recurring-scenarios, agent-governance, order-thread, supplier-invoice, po-generation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo 'Disk before SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          # Purse uses Node and Chromium, not the image's Android, .NET or Haskell SDKs.
          # Exact SDK roots come from actions/runner-images' Ubuntu installation scripts.
          # Keep Node/Corepack, checkout, system libraries and browser dependencies intact.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          echo 'Disk after SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: node tests/browser-${{ matrix.journey }}.mjs --width=${{ matrix.width }}
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-native-browser-proof-${{ matrix.journey }}-${{ matrix.width }}
          path: ${{ runner.temp }}/purse-proof
  search-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo 'Disk before SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          # Purse uses Node and Chromium, not the image's Android, .NET or Haskell SDKs.
          # Exact SDK roots come from actions/runner-images' Ubuntu installation scripts.
          # Keep Node/Corepack, checkout, system libraries and browser dependencies intact.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          echo 'Disk after SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: node tests/browser-search-scale.mjs
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-search-scale-proof
          path: ${{ runner.temp }}/purse-proof
  pantry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - name: Install the real Pantry integration peer
        run: |
          git clone --filter=blob:none https://github.com/just-every/run-pantry.git .cache/native-pantry
          git -C .cache/native-pantry checkout fb080a57b795dede06bfe6be2db7b85cc31a696b
          pnpm --dir .cache/native-pantry install --frozen-lockfile
      - run: node tests/pantry-flow.mjs
        env:
          PANTRY_CHECKOUT: ${{ github.workspace }}/.cache/native-pantry
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-pantry
      - run: node tests/browser-pantry.mjs
        env:
          PANTRY_CHECKOUT: ${{ github.workspace }}/.cache/native-pantry
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-pantry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-pantry-native-and-browser
          path: ${{ runner.temp }}/purse-pantry
