name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    outputs:
      skip: ${{ steps.reuse.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          WF_REF: ${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          wf="${WF_REF%@*}"; wf="${wf##*/}"
          # Evidence is only a push run of this workflow from this repository, never this run: a pull request
          # tests its merge ref, a dispatch may run a subset, and a PR run of this workflow may itself be a skip.
          # Prints "<status> <conclusion>" of the newest such run on SHA $1, or nothing (any API error: nothing).
          newest_push() {
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$wf/runs?head_sha=$1&event=push&per_page=100" \
              --jq "[.workflow_runs[] | select(.head_repository.full_name == \"$GITHUB_REPOSITORY\" and .id != $GITHUB_RUN_ID)] | max_by(.id) | select(. != null) | \"\(.status) \(.conclusion)\"" || true
          }
          green() { [ "$(newest_push "$1")" = "completed success" ]; }
          skip=false
          # C1: main push of a SHA whose newest push run of this workflow (a branch run) is green.
          if [ "$EVENT" = push ] && [ "$REF" = refs/heads/main ] && green "$GITHUB_SHA"; then skip=true; fi
          # C3 (exact): same tree as the parent, and the parent's newest push run is green (e.g. an empty commit).
          if [ "$skip" = false ] && [ "$EVENT" = push ] && parent=$(git rev-parse -q --verify HEAD~1) \
             && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'HEAD~1^{tree}')" ] && green "$parent"; then skip=true; fi
          # C2: same-repository PR. The lander takes any green same-repo run on the exact SHA as evidence,
          # pull_request runs included, so this run may pass without shards only when the push run on the
          # PR head is green: wait for it (at most 25 minutes).
          # No push run, any other result, or the wait running out: run in full.
          if [ "$EVENT" = pull_request ] && [ "$SAME_REPO" = true ]; then
            for _ in $(seq 1 50); do
              state=$(newest_push "$PR_HEAD")
              case "$state" in
                'completed success') skip=true; break ;;
                ''|completed\ *) break ;;
                *) sleep 30 ;;
              esac
            done
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
  rer-verify:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: bash scripts/ci/reclaim-disk.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec rer verify
  browser:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 390]
        # Every shard runs the complete archive checks and invoice-reading journey
        # (tests/browser.mjs and tests/browser-shard.mjs), so neither needs its own job.
        journey: [supplier-performance, catalogue, order-chasing, supplier-documents, supplier-duplicates, payables, audit-log, spend-report, po-documents, performance-report, invoice-risk, receipt-routing, quote-reading, rfq, invoice-inbox, email-intake, search, agreements, integration-tokens, agent-value, quote-agent, order-adoption, protected-storage, protected-preparation]
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.width == 1440 && 25 || 15 }}
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: bash scripts/ci/reclaim-disk.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - run: node tests/browser.mjs --width=${{ matrix.width }} --journey=${{ matrix.journey }}
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-browser-and-archive-proof-${{ matrix.journey }}-${{ matrix.width }}
          path: ${{ runner.temp }}/purse-proof
  purchase-kinds:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: bash scripts/ci/reclaim-disk.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - run: node tests/browser-po-kinds.mjs
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-po-kinds
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-po-kinds-and-archive-proof
          path: ${{ runner.temp }}/purse-po-kinds
  native-browser:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 390]
        journey: [coding-agent, spend-questions, request-again, protected-web, access, identity, scim, erasure, intake, order-send, evidence-history, integration-tokens, recurring-scenarios, agent-governance, order-thread, supplier-invoice, po-generation]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - run: node tests/browser-${{ matrix.journey }}.mjs --width=${{ matrix.width }}
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-native-browser-proof-${{ matrix.journey }}-${{ matrix.width }}
          path: ${{ runner.temp }}/purse-proof
  search-scale:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - run: node tests/browser-search-scale.mjs
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-search-scale-proof
          path: ${{ runner.temp }}/purse-proof
  pantry:
    needs: plan
    if: needs.plan.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: |
          set -euo pipefail
          pnpm exec playwright install --only-shell chromium
          # Hosted ubuntu-24.04 already carries Chromium's libraries. Use apt only when a real launch fails.
          node scripts/ci/chromium-probe.mjs || {
            timeout 420 pnpm exec playwright install-deps chromium
            node scripts/ci/chromium-probe.mjs
          }
      - name: Install the real Pantry integration peer
        run: |
          git clone --filter=blob:none https://github.com/just-every/run-pantry.git .cache/native-pantry
          git -C .cache/native-pantry checkout fb080a57b795dede06bfe6be2db7b85cc31a696b
          pnpm --dir .cache/native-pantry install --frozen-lockfile
      - run: node tests/pantry-flow.mjs
        env:
          PANTRY_CHECKOUT: ${{ github.workspace }}/.cache/native-pantry
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-pantry
      - run: node tests/browser-pantry.mjs
        env:
          PANTRY_CHECKOUT: ${{ github.workspace }}/.cache/native-pantry
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-pantry
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-pantry-native-and-browser
          path: ${{ runner.temp }}/purse-pantry
  verify:
    needs: [plan, rer-verify, browser, purchase-kinds, native-browser, search-scale, pantry]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require the plan and every shard
        env:
          PLAN: ${{ needs.plan.result }}
          SKIP: ${{ needs.plan.outputs.skip }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          test "$PLAN" = success
          if [ "$SKIP" = true ]; then exit 0; fi
          for result in $RESULTS; do test "$result" = success; done
