name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo 'Disk before SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          # Purse uses Node and Chromium, not the image's Android, .NET or Haskell SDKs.
          # Exact SDK roots come from actions/runner-images' Ubuntu installation scripts.
          # Keep Node/Corepack, checkout, system libraries and browser dependencies intact.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          echo 'Disk after SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec rer verify
  browser:
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 390]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo 'Disk before SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          # Purse uses Node and Chromium, not the image's Android, .NET or Haskell SDKs.
          # Exact SDK roots come from actions/runner-images' Ubuntu installation scripts.
          # Keep Node/Corepack, checkout, system libraries and browser dependencies intact.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          echo 'Disk after SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tests/browser.mjs --width=${{ matrix.width }}
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-browser-and-archive-proof-${{ matrix.width }}
          path: ${{ runner.temp }}/purse-proof
  native-browser:
    strategy:
      fail-fast: false
      matrix:
        width: [1440, 390]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo 'Disk before SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          # Purse uses Node and Chromium, not the image's Android, .NET or Haskell SDKs.
          # Exact SDK roots come from actions/runner-images' Ubuntu installation scripts.
          # Keep Node/Corepack, checkout, system libraries and browser dependencies intact.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          echo 'Disk after SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tests/browser-request-again.mjs --width=${{ matrix.width }}
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - run: node tests/browser-protected-web.mjs --width=${{ matrix.width }}
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - run: node tests/browser-access.mjs --width=${{ matrix.width }}
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - run: node tests/browser-identity.mjs --width=${{ matrix.width }}
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - run: node tests/browser-scim.mjs --width=${{ matrix.width }}
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - run: node tests/browser-evidence-history.mjs --width=${{ matrix.width }}
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-native-browser-proof-${{ matrix.width }}
          path: ${{ runner.temp }}/purse-proof
  search-scale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reclaim unused hosted-runner SDKs
        if: runner.os == 'Linux' && runner.environment == 'github-hosted'
        shell: bash
        run: |
          echo 'Disk before SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
          # Purse uses Node and Chromium, not the image's Android, .NET or Haskell SDKs.
          # Exact SDK roots come from actions/runner-images' Ubuntu installation scripts.
