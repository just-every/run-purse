          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          echo 'Disk after SDK cleanup (checkout, runner temp, runtime temp):'
          df -h "$GITHUB_WORKSPACE" "$RUNNER_TEMP" /tmp
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
      - run: corepack enable
      # Push checks use the locked project runtime. Global CLI qualification
      # runs in installer.yml on release tags and nightly.
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec rer install
      - run: pnpm exec playwright install --with-deps chromium
      - run: node tests/browser-search-scale.mjs
        env:
          PURSE_EVIDENCE: ${{ runner.temp }}/purse-proof
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: purse-search-scale-proof
          path: ${{ runner.temp }}/purse-proof
